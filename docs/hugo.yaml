baseURL: https://example.org/
locale: en-us
title: Aurora

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: "https://github.com/TheAhumMaitra/Aurora"
      params:
        icon: github

security:
  http:
    urls:
      - https://cdn.jsdelivr.net/

params:
  mainSections:
    - docs
  favicon:
    false

defaultContentLanguage: en

languages:
  en:
    languageName: English
    weight: 1
