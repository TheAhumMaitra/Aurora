{{ $src := .Get "src" }}
{{ $caption := .Get "caption" }}
{{ $width := .Get "width" | default "100%" }}
{{ $class := .Get "class" }}

<figure class="video {{ $class }}">

  {{ if $src }}

    {{/* External URL or static file */}}
    <video controls width="{{ $width }}" preload="metadata">
      <source src="{{ $src }}" type="video/mp4">
      Your browser does not support the video tag.
    </video>

  {{ else }}

    <p><strong>Video not found</strong></p>

  {{ end }}

  {{ with $caption }}
    <figcaption>{{ . }}</figcaption>
  {{ end }}

</figure>
