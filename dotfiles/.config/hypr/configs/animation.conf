animations {
    enabled = true

    bezier = easeOut, 0.22, 1, 0.36, 1
    bezier = easeIn, 0.4, 0, 1, 1
    bezier = smooth, 0.25, 0.1, 0.25, 1

    animation = windows, 1, 4.5, easeOut
    animation = windowsIn, 1, 4, easeOut, popin 85%
    animation = windowsOut, 1, 3.5, easeIn, popin 85%

    animation = fade, 1, 3.5, smooth
    animation = fadeIn, 1, 2.5, smooth
    animation = fadeOut, 1, 2.5, smooth

    animation = border, 1, 8, easeOut

    animation = layers, 1, 3.5, easeOut
    animation = layersIn, 1, 3, easeOut, fade
    animation = layersOut, 1, 2.5, easeIn, fade

    animation = workspaces, 1, 5, easeOut, slide
}