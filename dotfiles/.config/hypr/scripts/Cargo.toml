[package]
name = "aurora"
description = "All the scripts required to run Aurora. Aurora is a Rust based, fast, beautiful Hyprland rice"
version = "0.1.0"
license = "GPL-3.0-or-later"
authors = ["Ahum Maitra", "Ahum Maitra <theahummaitra@gmail.com>"]
edition = "2024"


[dependencies]
sysinfo = "0.30"
gtk4 = "0.11.3"
urlencoding = "2.1"
whoami = "2.1.1"
dirs = "6.0.0"
clap = { version = "4.6.1", features = ["derive"] }
toml = "1.1.2"
serde = { version = "1.0.228", features = ["derive"] }
