"$schema" = 'https://starship.rs/config-schema.json'
command_timeout = 1000

format = """
[](fg:magenta)\
$username\
[](fg:magenta bg:red)\
$directory\
[](fg:red bg:yellow)\
$git_branch\
$git_status\
[](fg:yellow bg:blue)\
$c\
$cpp\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:blue bg:cyan)\
$docker_context\
[](fg:cyan bg:green)\
$time\
[ ](fg:green)\
"""

[username]
show_always = true
style_user = "bg:black fg:bold yellow"
style_root = "bg:red fg:white"
format = "[$user ]($style)"

[directory]
style = "bg:red fg:white"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "bg:blue fg:white"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:blue fg:white"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:cyan fg:black"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:blue fg:white"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:blue fg:white"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:yellow fg:black"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:yellow fg:black"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:blue fg:white"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:blue fg:white"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:blue fg:white"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:blue fg:white"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:blue fg:white"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:blue fg:white"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:blue fg:white"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:blue fg:white"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:blue fg:white"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:blue fg:white"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:green fg:black"
format = '[ ♥ $time ]($style)'