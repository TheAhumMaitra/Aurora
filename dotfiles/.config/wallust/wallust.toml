# wallust v3.5
#
# You can copy this file to ~/.config/wallust/wallust.toml (keep in mind is a sample config)

# SIMPLE TUTORIAL, or `man wallust.5`:
# https://explosion-mental.codeberg.page/wallust/
#
# If comming from v2: https://explosion-mental.codeberg.page/wallust/v3.html#wallusttoml

# Global section - values below can be overwritten by command line flags

# How the image is parse, in order to get the colors:
# full - resized - wal - thumb -  fastresize - kmeans
backend = "fastresize"

# What color space to use to produce and select the most prominent colors:
# lab - labmixed - lch - lchmixed - salience
color_space = "salience"

# Use the most prominent colors in a way that makes sense, a scheme color palette:
# dark - dark16 - darkcomp - darkcomp16
# light - light16 - lightcomp - lightcomp16
# harddark - harddark16 - harddarkcomp - harddarkcomp16
# softdark - softdark16 - softdarkcomp - softdarkcomp16
# softlight - softlight16 - softlightcomp - softlightcomp16
# saliencedark - saliencedarkbalanced - saliencedarkdistributed - saliencedarklow (each has the 16 variations)
# salienceligh - saliencelightbalanced - saliencelightdistributed - saliencelightlow (each has the 16 variations)
palette = "saliencedark"

# Ensures a "readable contrast" (OPTIONAL, disabled by default)
# Should only be enabled when you notice an unreadable contrast frequently happening
# with your images. The reference color for the contrast is the background color.
#check_contrast = true

# Color saturation, between [1% and 100%] (OPTIONAL, disabled by default)
# usually something higher than 50 increases the saturation and below
# decreases it (on a scheme with strong and vivid colors)
#saturation = 35

# Alpha value for templating, by default 100 (no other use whatsoever)
#alpha = 100

# Disables hooks completly
#no_hooks = true

[templates]
# NOTE: prefer '' over "" for paths, avoids escaping.
# template: A RELATIVE path that points to `~/.config/wallust/templates` (depends on platform)
# target: ABSOLUTE path in which to place a file with generated templated values.
# ¡ If either one is a directory, then both SHOULD be one. !
#
# Same ten targets and key names as the matugen templates in
# ~/.config/matugen/templates, so either tool can drive the rice.
#
# Role mapping, since wallust only hands out 16 unnamed slots:
#   background -> base bg, lighten() it for surface/border,
#   foreground -> text, blend() it towards grey to stay readable,
#   color6     -> accent, color5/color4 step down,
#   literals   -> error/warning/success and the chromatic ANSI slots,
#                 because wallust has no hue filter.
#
#   wallust run ~/.config/hypr/default.png

hypr         = { template = 'hypr-colors.lua.template',         target = '~/.config/hypr/colors.lua' }
hypr-custom  = { template = 'hypr-custom.css.template',          target = '~/.config/hypr/scripts/src/custom.css' }
quickshell   = { template = 'quickshell-colors.qml.template',    target = '~/.config/quickshell/colors.qml' }
waybar       = { template = 'waybar-colors.css.template',        target = '~/.config/waybar/colors.css' }
wlogout      = { template = 'wlogout-colors.css.template',       target = '~/.config/wlogout/colors.css' }
swaync       = { template = 'swaync-colors.css.template',        target = '~/.config/swaync/colors.css' }
rofi         = { template = 'rofi-colors.rasi.template',         target = '~/.config/rofi/colors.rasi' }
kitty        = { template = 'kitty-colors.conf.template',        target = '~/.config/kitty/colors.conf' }
ghostty      = { template = 'ghostty-colors.ghostty.template',   target = '~/.config/ghostty/colors.ghostty' }
btop         = { template = 'btop-theme.template',               target = '~/.config/btop/themes/current.theme' }

[hooks]
# Run commands when wallust is invoked. Useful to avoid scripting.
#wallpaper = """swww img "$(find ~/Media/Pictures/Wallpapers -iregex '.*.\\(jpg\\|jpeg\\|png\\|gif\\)' -type f | shuf -n 1)" """
waybar = 'waybar_refresh || true'
swaync = 'pkill -SIGUSR1 swaync || true'
